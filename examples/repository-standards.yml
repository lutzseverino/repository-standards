# YAML is optional and requires PyYAML. JSON is the dependency-free default.
standards-version: 2
standards-release: 1.1.0
profiles:
  - common
  - documentation
  - node-npm
  - vite-react
boundaries:
  - path: "."
    type: repository
    title: Product Name
variables: {}
local-fragments:
  .gitignore:
    - .repository-standards/gitignore.local
repository-owned:
  - README.md
  - LICENSE
  - docs/README.md
  - docs/decisions/**
  - docs/explanation/**
  - docs/how-to/**
  - docs/reference/**
  - docs/tutorials/**
  - src/**
  - package.json
  - package-lock.json
  - .github/workflows/ci.yml
  - .github/workflows/release.yml
