# YAML is optional and requires PyYAML. JSON is the dependency-free default.
standards-version: 5
standards-release: 4.0.0
profiles:
  - common
  - documentation
  - node-npm
  - vite-react
boundaries:
  - path: "."
    type: repository
    title: Product Name
dependency-updates:
  - ecosystem: github-actions
    directory: /
    schedule: weekly
  - ecosystem: npm
    directory: /
    schedule: weekly
github:
  repository: example/product
  default-branch: main
  settings:
    delete-branch-on-merge: true
    allow-squash-merge: true
    allow-merge-commit: false
    allow-rebase-merge: false
  ruleset:
    name: Protect main
    required-status-checks: [CI / Required]
    require-current-branch: true
    required-approvals: 0
    allowed-merge-methods: [squash]
    prevent-deletion: true
    prevent-force-push: true
    allow-bypass-actors: false
variables: {}
local-fragments:
  .gitignore:
    - .repository-standards/gitignore.local
repository-owned:
  - README.md
  - LICENSE
  - CONTEXT.md
  - docs/README.md
  - docs/agents/domain.md
  - docs/adr/**
  - docs/explanation/**
  - docs/how-to/**
  - docs/reference/**
  - docs/tutorials/**
  - src/**
  - package.json
  - package-lock.json
  - .github/workflows/ci.yml
  - .github/workflows/release.yml
