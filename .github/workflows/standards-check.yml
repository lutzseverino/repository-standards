name: Standards Check

on:
  schedule:
    - cron: "41 7 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: standards-check
  cancel-in-progress: false

jobs:
  repository:
    name: Standards Check / ${{ matrix.repository }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        repository:
          - lutzseverino/repository-standards
          - lutzseverino/repository-standards-demo
    steps:
      - name: Check out standards tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out target repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.repository }}
          path: target
      - name: Read adopted standards release
        id: manifest
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(
              Path("target/.repository-standards.json").read_text(encoding="utf-8")
          )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              print(f"release={manifest['standards-release']}", file=output)
              print(f"version={manifest['standards-version']}", file=output)
          PY
      - name: Check out adopted standards release
        if: matrix.repository != github.repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lutzseverino/repository-standards
          ref: v${{ steps.manifest.outputs.release }}
          path: adopted-standards
      - name: Check repository standards source
        if: matrix.repository == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/standards check target
      - name: Check adopted standards
        if: matrix.repository != github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: adopted-standards/scripts/standards check target
      - name: Validate target workflows from repository source
        if: matrix.repository == github.repository
        run: |
          cd target
          python3 ../profiles/common/files/.github/scripts/check-workflows.py
      - name: Validate target workflows from adopted standards
        if: matrix.repository != github.repository
        run: |
          cd target
          python3 ../adopted-standards/profiles/common/files/.github/scripts/check-workflows.py
